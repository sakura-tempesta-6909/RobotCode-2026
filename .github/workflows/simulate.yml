name: FRC Simulate CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache .gradle folder
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Install Xvfb for GUI-based simulation
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run FRC simulation (Check for 30s stability)
        run: |
          mkdir -p logs
          timeout 30s xvfb-run --auto-servernum ./gradlew simulateJava -Pheadless -PhaltOnExit --stacktrace 2>&1 | tee logs/sim.log || true

      - name: Verify simulation ran for full 30s
        run: |
          if grep -q "Robot program startup complete" logs/sim.log; then
            echo "✅ Simulation started successfully!"
          else
            echo "❌ Simulation did not log startup message!"
            exit 1
          fi